<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ember-Eyed Entity</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--ember:#ff3b1f;--bone:#ead2c0}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#050101;overflow:hidden;font-family:'Cormorant Garamond',Georgia,serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#voice{position:fixed;left:50%;bottom:calc(clamp(24px,10.5vh,120px) + 74px);transform:translateX(-50%);width:min(640px,88vw);text-align:center;color:var(--bone);font-style:italic;font-size:clamp(18px,2.2vw,24px);line-height:1.45;text-shadow:0 0 14px rgba(255,50,20,.85),0 2px 8px #000;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
#voice.on{opacity:1;transition:opacity .3s}
.bar{position:fixed;left:50%;bottom:clamp(24px,10.5vh,120px);transform:translateX(-50%);display:flex;gap:16px;align-items:center;width:min(92vw,max(560px,36vw))}
.field{position:relative;flex:1;display:flex}
.bar input{flex:1;min-width:0;height:58px;padding:0 58px 0 26px;border-radius:29px;border:1px solid rgba(255,59,31,.3);background:rgba(16,5,4,.55);backdrop-filter:blur(3px);color:var(--bone);font:italic 21px 'Cormorant Garamond',Georgia,serif;outline:none;transition:border-color .3s,box-shadow .3s}
.bar input::placeholder{color:rgba(234,210,192,.5)}
.bar input:focus-visible{border-color:var(--ember);box-shadow:0 0 24px rgba(255,59,31,.35)}
.bar button{cursor:pointer;background:none;border:0;color:var(--ember);padding:0}
#mic{width:58px;height:58px;flex:none;border-radius:50%;border:1.5px solid var(--ember);background:rgba(30,4,2,.45);display:grid;place-items:center;box-shadow:0 0 18px rgba(255,59,31,.3);transition:box-shadow .3s,transform .2s}
#mic.live{box-shadow:0 0 36px rgba(255,59,31,.95);transform:scale(1.06)}
#send{position:absolute;right:14px;top:50%;translate:0 -50%;width:40px;height:40px;display:grid;place-items:center;opacity:.8}
#send:hover,#mic:hover{filter:brightness(1.35)}
#mic:focus-visible,#send:focus-visible{outline:2px solid var(--bone);outline-offset:3px;border-radius:50%}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="voice" role="status" aria-live="polite"></div>
<form class="bar" id="f" onsubmit="return false">
  <button type="button" id="mic" aria-label="Speak">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
  </button>
  <div class="field">
    <input id="in" type="text" placeholder="Speak or type…" autocomplete="off" aria-label="Message">
    <button type="submit" id="send" aria-label="Send">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M3 12 21 4l-5 16-4-6.5L3 12Zm9 1.5L21 4"/></svg>
    </button>
  </div>
</form>

<script>

   In your project, replace IMG with a normal URL

     Entity.onMessage = async (userText) => 'reply'
     Entity.say(text) | Entity.stream(chunk) + Entity.endStream()
     Entity.setState('idle'|'listening'|'thinking'|'speaking')
     Entity.setLevel(0..1)  Entity.pulse(0..1)

uniform sampler2D T;uniform vec2 R,O,P;uniform float S,t,e,k,bl,mo;uniform vec2 C[7];
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*n(p);p*=2.03;a*=.5;}return s;}
void main(){
  vec2 uv=(vec2(gl_FragCoord.x,R.y-gl_FragCoord.y)-O)/S/vec2(1672.,941.);
  vec2 asp=vec2(1.777,1.);
  vec2 E0=vec2(.4635,.2093)+P*.0035, E1=vec2(.5353,.2062)+P*.0035;
  float de=min(length((uv-E0)*asp),length((uv-E1)*asp));
  // smoke region mask: wide above the book, calmer near the eyes
  float m=smoothstep(.58,.36,uv.y)*smoothstep(.44,.1,abs(uv.x-.5))*smoothstep(.012,.06,de);
  float amp=(.003+.017*e)*mo;
  vec2 q=uv*vec2(4.,3.)+vec2(0.,-t*.14*(1.+e));
  vec2 d=vec2(fbm(q+t*.07)-.5,fbm(q+7.3-t*.05)-.5);
  vec2 w=uv+d*amp*2.*m;
  w+=(vec2(.5,.52)-w)*.035*e*m*mo*(.5+.5*sin(t*2.6));        // billow toward/away from the book
  for(int i=0;i<7;i++){                                        // flame sway
    float r=length((uv-C[i])*asp);
    w.x+=sin(t*10.+float(i)*2.+uv.y*90.)*.0022*smoothstep(.045,0.,r)*(1.+e)*mo;
  }
  vec3 c=texture2D(T,w).rgb;
  // eyes: blink + glow
  float em=exp(-pow(de/.02,2.));
  c=mix(c,c*.12,bl*em);
  // emissive boost on the red parts of the photo (veins, ring, eye rims)
  float red=max(0.,c.r-max(c.g,c.b)*1.2);
  float flick=.55+.45*n(uv*vec2(34.,22.)+vec2(0.,-t*1.8));
  float fl=smoothstep(.62,.74,uv.y);
  float wave=.5+.5*sin(length((uv-vec2(.5,.75))*vec2(1.78,3.))*30.-t*(2.+e*6.));
  float boost=e*(1.5*flick*(1.-fl)+1.2*fl*wave);
  c+=vec3(1.,.22,.08)*red*boost*1.4;
  float g0=length((uv-E0)*asp),g1=length((uv-E1)*asp),ew=.028+.05*e;
  c+=vec3(1.,.26,.09)*(exp(-pow(g0/ew,2.))+exp(-pow(g1/ew,2.)))*(.18+.8*e)*k*(1.-bl);
  // book + candle light
  float bg=exp(-pow(length((uv-vec2(.499,.53))*asp)/(.15+.13*e),2.));
  c+=vec3(1.,.28,.12)*bg*(.03+.4*e)*(.82+.18*sin(t*2.1));
  for(int i=0;i<7;i++){
    float r=length((uv-C[i])*asp);
    float f=.85+.15*sin(t*11.+float(i)*3.)+.12*n(vec2(t*6.,float(i)));
    c+=vec3(1.,.45,.15)*exp(-r*r/(.011+.004*e))*(.07+.09*e)*f;
  }
  gl_FragColor=vec4(c,1.);
}`;
let ok=!!gl,U={},tex;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o}
if(ok){
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))ok=false;
  else{gl.useProgram(pr);
    const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const a=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
    ['T','R','O','P','S','t','e','k','bl','mo','C'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
    gl.uniform2fv(U.C,new Float32Array([157,595,405,483,1259,497,1325,503,1457,590,216,795,1273,822].map((v,i)=>v/(i%2?IH:IW))));
  }
}
let ready=false,vw,vh,dpr,S,ox,oy;
const im=new Image();
im.onload=()=>{
  if(ok){tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im)}
  else{document.body.style.background=`#050101 url(${IMG}) center/cover`}
  ready=true};
im.src=IMG;
function resize(){dpr=Math.min(devicePixelRatio||1,2);vw=innerWidth;vh=innerHeight;
  [gc,fc].forEach(c=>{c.width=vw*dpr;c.height=vh*dpr});
  S=Math.max(vw/IW,vh/IH);ox=(vw-IW*S)/2;oy=(vh-IH*S)/2;
  if(ok)gl.viewport(0,0,gc.width,gc.height)}
addEventListener('resize',resize);resize();

/* ---------- embers / sparks overlay ---------- */
const spr=document.createElement('canvas');spr.width=spr.height=32;
{const g=spr.getContext('2d'),r=g.createRadialGradient(16,16,0,16,16,16);r.addColorStop(0,'rgba(255,200,140,1)');r.addColorStop(.25,'rgba(255,90,30,.7)');r.addColorStop(1,'rgba(255,40,10,0)');g.fillStyle=r;g.fillRect(0,0,32,32)}
const sp=[];let sa=0;
const origins=[[835,520],[157,595],[405,483],[1259,497],[1457,590]];
function addSpark(burst){const o=burst?[835+rnd(-110,110),rnd(490,540)]:origins[1+Math.floor(rnd(4))];
  sp.push({x:o[0]+rnd(-6,6),y:o[1]+(burst?0:rnd(-10,0)),vx:rnd(-14,14),vy:-rnd(25,90)*(burst?1.4:.6),l:0,m:rnd(1.6,4.5),s:rnd(.5,1.5),p:rnd(6)})}
for(let i=0;i<60;i++){addSpark(Math.random()<.5);sp[i].l=rnd(sp[i].m)}

/* ---------- loop ---------- */
function update(dt){
  E.t+=dt;E.pv*=Math.pow(.02,dt);
  const th=E.state==='thinking'?Math.sin(E.t*6)*.06:0;
  const tgt=Math.min(1.15,BASE[E.state]+th+E.lv*.5+E.pv*.55);
  E.e+=(tgt-E.e)*Math.min(1,dt*7);
  E.px+=(E.tx-E.px)*Math.min(1,dt*3);E.py+=(E.ty-E.py)*Math.min(1,dt*3);
  E.nb-=dt;if(E.nb<0){E.bl=1;E.nb=rnd(2.5,6.5)}
  E.blink=E.bl>0?Math.sin(Math.PI*(1-E.bl)):0;E.bl=Math.max(0,E.bl-dt*6);
  sa+=(10+E.e*60)*dt;while(sa>1){addSpark(Math.random()<.5+E.e*.4);sa--}
  for(let i=sp.length-1;i>=0;i--){const p=sp[i];p.l+=dt;if(p.l>p.m||sp.length>260){sp.splice(i,1);continue}
    p.x+=(p.vx+Math.sin(E.t*2+p.p)*10)*dt;p.y+=p.vy*dt}}
function draw(){
  if(ok&&ready){
    gl.uniform1i(U.T,0);gl.uniform2f(U.R,gc.width,gc.height);gl.uniform2f(U.O,ox*dpr,oy*dpr);gl.uniform1f(U.S,S*dpr);
    gl.uniform1f(U.t,E.t);gl.uniform1f(U.e,E.e);gl.uniform1f(U.k,1+(E.state==='thinking'?Math.sin(E.t*6)*.25:0));
    gl.uniform1f(U.bl,E.blink);gl.uniform1f(U.mo,reduce?.3:1);gl.uniform2f(U.P,E.px,E.py);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
  fx.setTransform(dpr,0,0,dpr,0,0);fx.clearRect(0,0,vw,vh);fx.globalCompositeOperation='lighter';
  for(const p of sp){const u=p.l/p.m,a=Math.sin(Math.PI*u)*(.5+Math.abs(Math.sin(E.t*3+p.p))*.5)*(.45+E.e*.7);
    const r=(3+p.s*5)*S;fx.globalAlpha=Math.min(1,a);fx.drawImage(spr,p.x*S+ox-r,p.y*S+oy-r,r*2,r*2)}
  fx.globalAlpha=1}
let last=performance.now();
(function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)})(last);

/* ---------- public API + UI ---------- */
const voice=$('voice'),inp=$('in'),mic=$('mic');
let hideT,typing=0,streamOn=false;
const Entity=window.Entity={
  onMessage:null,
  setState(s){if(BASE[s]!==undefined)E.state=s},
  setLevel(v){E.lv=Math.max(0,Math.min(1,v))},
  pulse(v=.6){E.pv=Math.min(1.2,E.pv+v)},
  beginStream(){clearTimeout(hideT);voice.textContent='';voice.classList.add('on');streamOn=true;E.state='speaking'},
  stream(c){if(!streamOn)Entity.beginStream();for(const ch of c){voice.textContent+=ch;if(/\S/.test(ch))Entity.pulse(/[aeiouy]/i.test(ch)?.5:.22)}},
  endStream(){streamOn=false;E.state='idle';clearTimeout(hideT);hideT=setTimeout(()=>voice.classList.remove('on'),2500+voice.textContent.length*45)},
  async say(text,cps=26){Entity.beginStream();for(const ch of text){Entity.stream(ch);await new Promise(r=>setTimeout(r,1000/cps*(/[.,;!?]/.test(ch)?5:1)))}Entity.endStream()},
  async send(text){if(!text.trim())return;Entity.setState('thinking');voice.classList.remove('on');
    let reply;try{reply=await(Entity.onMessage?Entity.onMessage(text):demo())}catch(e){reply='The flame falters. Ask again.'}
    await Entity.say(reply)},
  attachAudio(src){const A=new(window.AudioContext||window.webkitAudioContext)(),an=A.createAnalyser();an.fftSize=256;
    const n=src instanceof MediaStream?A.createMediaStreamSource(src):A.createMediaElementSource(src);n.connect(an);
    if(!(src instanceof MediaStream))an.connect(A.destination);
    const d=new Uint8Array(an.frequencyBinCount);(function tick(){an.getByteFrequencyData(d);let s=0;for(const v of d)s+=v;Entity.setLevel(s/d.length/110);requestAnimationFrame(tick)})()}
};
const lines=['I have waited in this ember-light for you. Ask, and I will answer.','Every page here remembers a name. Whose do you carry?','You speak softly, yet the candles lean toward you.','That is a question with teeth. I like it.'];
const demo=async()=>{await new Promise(r=>setTimeout(r,1400));return lines[Math.floor(Math.random()*lines.length)]};
$('f').addEventListener('submit',()=>{const t=inp.value;inp.value='';Entity.send(t)});
inp.addEventListener('input',()=>{Entity.pulse(.12);if(E.state==='idle'||E.state==='listening'){E.state='listening';clearTimeout(typing);typing=setTimeout(()=>{if(E.state==='listening')E.state='idle'},1500)}});
inp.addEventListener('focus',()=>{if(E.state==='idle')E.state='listening'});
inp.addEventListener('blur',()=>{if(E.state==='listening')E.state='idle'});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
mic.addEventListener('click',()=>{
  if(!SR){inp.focus();return}
  const r=new SR();r.lang='en-US';r.interimResults=true;
  r.onstart=()=>{mic.classList.add('live');E.state='listening'};
  r.onresult=e=>{const t=[...e.results].map(x=>x[0].transcript).join('');inp.value=t;Entity.pulse(.2);if(e.results[e.results.length-1].isFinal){inp.value='';Entity.send(t)}};
  r.onend=()=>{mic.classList.remove('live');if(E.state==='listening')E.state='idle'};
  r.start()});
})();
</script>
